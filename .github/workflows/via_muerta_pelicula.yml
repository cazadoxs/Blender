name: Via muerta - película entera en GitHub (CPU)

# Renderiza la película entera a calidad final (1920x804, --calidad equilibrada) en los ordenadores
# gratuitos de GitHub. La película se parte en bloques de 10 fotogramas; cada bloque es un trabajo
# y se guarda como un .tar en la release "via-muerta-fotogramas". Un bloque que ya está en la
# release no se repite, así que se puede relanzar las veces que haga falta.
# Una matriz admite como mucho 256 trabajos, así que hay dos (parte 1 y parte 2); GitHub los va
# ejecutando de 20 en 20. Se lanza subiendo un cambio a escenas/via_muerta/render_github.txt.
on:
  workflow_dispatch:
  push:
    branches: [claude/corto-terror-nocturno-41r3pk]
    paths: ['escenas/via_muerta/render_github.txt']

permissions:
  contents: write

env:
  BLOQUE: 10
  TOTAL: 4457
  RELEASE: via-muerta-fotogramas

jobs:
  bloques:
    runs-on: ubuntu-latest
    outputs:
      parte1: ${{ steps.l.outputs.parte1 }}
      parte2: ${{ steps.l.outputs.parte2 }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: l
        run: |
          n=$(( (TOTAL + BLOQUE - 1) / BLOQUE ))
          echo "parte1=[$(seq -s, 0 $(( n < 256 ? n-1 : 255 )))]" >> $GITHUB_OUTPUT
          echo "parte2=[$(seq -s, 256 $(( n-1 )))]" >> $GITHUB_OUTPUT
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" --prerelease --target "$GITHUB_SHA" --title "Vía muerta: fotogramas" --notes "Fotogramas de la película en bloques de $BLOQUE, generados por via_muerta_pelicula.yml."

  parte1:
    needs: bloques
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        bloque: ${{ fromJSON(needs.bloques.outputs.parte1) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: escenas/via_muerta
    steps:
      - uses: actions/checkout@v4
      - name: ¿Bloque ya hecho?
        id: hecho
        run: |
          nombre=$(printf 'bloque_%03d.tar' ${{ matrix.bloque }})
          echo "nombre=$nombre" >> $GITHUB_OUTPUT
          if gh release view "$RELEASE" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$nombre"; then
            echo "Ya está en la release: $nombre"; echo "si=1" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.hecho.outputs.si != '1'
        with:
          python-version: '3.11'
      - name: Instalar Blender 5.2 y añadir memoria de intercambio
        if: steps.hecho.outputs.si != '1'
        working-directory: /tmp
        run: |
          v=$(curl -s https://download.blender.org/release/Blender5.2/ | grep -o 'blender-5\.2\.[0-9]*-linux-x64\.tar\.xz' | sort -V | tail -1)
          curl -sL "https://download.blender.org/release/Blender5.2/$v" | tar xJ
          echo "$(ls -d /tmp/blender-5.2*/ | head -1)" >> $GITHUB_PATH
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon0 >/dev/null
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
      - uses: actions/cache@v4
        if: steps.hecho.outputs.si != '1'
        with:
          path: escenas/via_muerta/recursos
          key: recursos-full-${{ hashFiles('escenas/via_muerta/recursos.json') }}
          restore-keys: recursos-full-
      - name: Descargar recursos y construir escena
        if: steps.hecho.outputs.si != '1'
        run: |
          python descargar_recursos.py 2>&1 | tail -3
          blender -b --factory-startup -P construir_escena.py 2>&1 | tail -5
      - name: Renderizar bloque
        if: steps.hecho.outputs.si != '1'
        run: |
          a=$(( ${{ matrix.bloque }} * BLOQUE + 1 )); b=$(( a + BLOQUE - 1 )); b=$(( b > TOTAL ? TOTAL : b ))
          echo "Fotogramas $a a $b"
          blender -b via_muerta.blend -P render.py -- --calidad equilibrada --start $a --end $b --out render/frames 2>&1 | grep --line-buffered -E "Saved:|rror|Terminado" || true
          n=$(find render/frames -name 'f_*.png' -size +0 | wc -l)
          echo "Hechos: $n"; [ "$n" -eq $(( b - a + 1 )) ]
      - name: Subir a la release
        if: steps.hecho.outputs.si != '1'
        run: |
          tar -cf "${{ steps.hecho.outputs.nombre }}" -C render/frames .
          gh release upload "$RELEASE" "${{ steps.hecho.outputs.nombre }}" --clobber

  parte2:
    needs: bloques
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        bloque: ${{ fromJSON(needs.bloques.outputs.parte2) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: escenas/via_muerta
    steps:
      - uses: actions/checkout@v4
      - name: ¿Bloque ya hecho?
        id: hecho
        run: |
          nombre=$(printf 'bloque_%03d.tar' ${{ matrix.bloque }})
          echo "nombre=$nombre" >> $GITHUB_OUTPUT
          if gh release view "$RELEASE" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$nombre"; then
            echo "Ya está en la release: $nombre"; echo "si=1" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.hecho.outputs.si != '1'
        with:
          python-version: '3.11'
      - name: Instalar Blender 5.2 y añadir memoria de intercambio
        if: steps.hecho.outputs.si != '1'
        working-directory: /tmp
        run: |
          v=$(curl -s https://download.blender.org/release/Blender5.2/ | grep -o 'blender-5\.2\.[0-9]*-linux-x64\.tar\.xz' | sort -V | tail -1)
          curl -sL "https://download.blender.org/release/Blender5.2/$v" | tar xJ
          echo "$(ls -d /tmp/blender-5.2*/ | head -1)" >> $GITHUB_PATH
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon0 >/dev/null
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
      - uses: actions/cache@v4
        if: steps.hecho.outputs.si != '1'
        with:
          path: escenas/via_muerta/recursos
          key: recursos-full-${{ hashFiles('escenas/via_muerta/recursos.json') }}
          restore-keys: recursos-full-
      - name: Descargar recursos y construir escena
        if: steps.hecho.outputs.si != '1'
        run: |
          python descargar_recursos.py 2>&1 | tail -3
          blender -b --factory-startup -P construir_escena.py 2>&1 | tail -5
      - name: Renderizar bloque
        if: steps.hecho.outputs.si != '1'
        run: |
          a=$(( ${{ matrix.bloque }} * BLOQUE + 1 )); b=$(( a + BLOQUE - 1 )); b=$(( b > TOTAL ? TOTAL : b ))
          echo "Fotogramas $a a $b"
          blender -b via_muerta.blend -P render.py -- --calidad equilibrada --start $a --end $b --out render/frames 2>&1 | grep --line-buffered -E "Saved:|rror|Terminado" || true
          n=$(find render/frames -name 'f_*.png' -size +0 | wc -l)
          echo "Hechos: $n"; [ "$n" -eq $(( b - a + 1 )) ]
      - name: Subir a la release
        if: steps.hecho.outputs.si != '1'
        run: |
          tar -cf "${{ steps.hecho.outputs.nombre }}" -C render/frames .
          gh release upload "$RELEASE" "${{ steps.hecho.outputs.nombre }}" --clobber
