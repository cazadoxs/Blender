          echo "Fotogramas $a a $b"
          # no empieza fotogramas nuevos pasadas 4 h 50 min desde el inicio del trabajo (el límite es 6 h);
          # lo que quede se guarda como parte y se termina en la siguiente ejecución
          limite=$(( ${{ steps.hecho.outputs.inicio }} + 290*60 ))
          # a veces GitHub apaga el ordenador a mitad: cada 10 min se sube lo hecho como parte para no
          # perderlo (solo PNG con más de 1 min, ya escritos del todo)
          mkdir -p render/frames /tmp/copia
          copia=/tmp/copia/${{ steps.hecho.outputs.nombre }}_parte.tar
          (prev=$(find render/frames -name 'f_*.png' -size +0 | wc -l); while sleep 600; do
